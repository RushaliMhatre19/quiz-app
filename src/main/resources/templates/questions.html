<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manage Questions</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/questions.css}">
</head>

<body>

<header>
    <h1>Online Quiz Application</h1>
</header>

<div class="questions-container">

    <h1>Manage Questions</h1>

    <div class="question-card"
         th:each="question : ${questions}">

        <h3 th:text="${question.questionText}">
            Question
        </h3>

        <p>
            <strong>A:</strong>
            <span th:text="${question.optionA}"></span>
        </p>

        <p>
            <strong>B:</strong>
            <span th:text="${question.optionB}"></span>
        </p>

        <p>
            <strong>C:</strong>
            <span th:text="${question.optionC}"></span>
        </p>

        <p>
            <strong>D:</strong>
            <span th:text="${question.optionD}"></span>
        </p>

        <p class="correct-answer">
            <strong>Correct Answer:</strong>
            <span th:text="${question.correctAnswer}"></span>
        </p>
        
        <a th:href="@{/edit-question/{id}(id=${question.id})}"
   class="edit-btn">
    Edit
</a>
        
        <a th:href="@{/delete-question/{id}(id=${question.id})}"
   class="delete-btn"
   onclick="return confirm('Are you sure you want to delete this question?')">
    Delete
</a>

    </div>

    <a th:href="@{/}" class="home-btn">Back to Home</a>

</div>

</body>
</html>
